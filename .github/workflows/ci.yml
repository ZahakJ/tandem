# Builds the debug APK for every push to main and every pull request, and
# checks that the website and its documentation pages still build.
#
# The APK is attached to the run as an artifact, so a pull request can be
# tried on a device without building it locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: pull requests from forks run here, and nothing in this workflow
# needs to write anything.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # A modified gradle-wrapper.jar in a pull request would run arbitrary
      # code on the runner; this checks it against Gradle's published hashes.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          # The NDK builds the controller passthrough helper (app/src/padlink).
          packages: "platforms;android-34 build-tools;34.0.0 ndk;27.2.12479018"

      # Caches the Gradle distribution, dependencies and build cache. Only
      # builds on main write to the cache, so pull requests can't poison it.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Name the APK after the commit
        id: apk
        run: |
          short="${GITHUB_SHA::7}"
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/tandem-debug-${short}.apk"
          echo "name=tandem-debug-${short}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error

  site:
    name: Website and docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Renders docs/ into site/docs/ and fails on a link to a page, heading
      # or file that doesn't exist, from the docs or from the landing page.
      - name: Build the documentation
        run: node scripts/build-docs.mjs
