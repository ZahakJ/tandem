# Builds a signed release APK when a version tag is pushed, and attaches it to
# the GitHub Release for that tag (creating the release if it doesn't exist).
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# The tag must match versionName in app/build.gradle.kts (v0.3.0 <-> "0.3.0"),
# so a release can't go out with the wrong version inside it.
#
# Signing needs four repository secrets; docs/RELEASING.md explains how to
# create them:
#
#   TANDEM_KEYSTORE_BASE64    the release keystore (.jks), base64-encoded
#   TANDEM_KEYSTORE_PASSWORD  the keystore's password
#   TANDEM_KEY_ALIAS          the key's alias inside the keystore
#   TANDEM_KEY_PASSWORD       the key's password
#
# The APK is built unsigned by Gradle and signed here with apksigner, so the
# signing setup lives in one place and the Gradle build never sees a secret.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.3.0"
        required: true

permissions:
  contents: write # create the release and upload the APK

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches the app version
        run: |
          version=$(sed -n 's/^ *versionName *= *"\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} doesn't match versionName \"${version}\" in app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Check the signing secrets are set
        env:
          KEYSTORE: ${{ secrets.TANDEM_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.TANDEM_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.TANDEM_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.TANDEM_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing TANDEM_KEYSTORE_BASE64"
          [ -n "$STORE_PASS" ] || missing="$missing TANDEM_KEYSTORE_PASSWORD"
          [ -n "$ALIAS" ] || missing="$missing TANDEM_KEY_ALIAS"
          [ -n "$KEY_PASS" ] || missing="$missing TANDEM_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:${missing}. See docs/RELEASING.md."
            exit 1
          fi

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          # The NDK builds the controller passthrough helper (app/src/padlink).
          packages: "platforms;android-34 build-tools;34.0.0 ndk;27.2.12479018"

      # Release builds read the cache but never write it.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Build
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Sign
        env:
          KEYSTORE: ${{ secrets.TANDEM_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.TANDEM_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.TANDEM_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.TANDEM_KEY_PASSWORD }}
        run: |
          tools="$ANDROID_HOME/build-tools/34.0.0"
          ks="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE" | base64 --decode > "$ks"
          mkdir -p out
          apk="out/tandem-${VERSION}.apk"
          "$tools/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          # Passwords go through the environment, never the command line, so
          # they can't show up in a process listing or the log.
          "$tools/apksigner" sign \
            --ks "$ks" --ks-key-alias "$ALIAS" \
            --ks-pass env:STORE_PASS --key-pass env:KEY_PASS \
            --out "$apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$ks"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          (cd out && sha256sum "tandem-${VERSION}.apk" > SHA256SUMS)
          # The certificate fingerprint lets people check the APK with tools
          # like AppVerifier, and Obtainium shows it on first install.
          echo "CERT_SHA256=$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" | head -n1)" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Install \`tandem-${VERSION}.apk\` on Android 11 or newer. Updates install over earlier releases and keep your data."
            echo
            echo "Signing certificate SHA-256: \`${CERT_SHA256}\`"
          } > "$notes"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "Tandem ${VERSION}" --notes-file "$notes" --generate-notes --verify-tag
          fi
