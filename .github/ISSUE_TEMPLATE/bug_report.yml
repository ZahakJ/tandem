name: Bug report
description: Something broke or looks wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: A few words is enough. We'll ask if we need more.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you saw, and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Device and Tandem version
      description: The version is in Settings › Play & system › Updates.
      placeholder: "AYN Thor, 0.10.0"
  - type: textarea
    id: media
    attributes:
      label: Screenshot or video
      description: Optional. Drag it in here. A bug report zip from Settings › Play & system › Updates › Send a bug report helps too.
