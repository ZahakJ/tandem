name: Emulator or app support
description: An emulator or app Tandem doesn't start, or doesn't know yet.
labels: [emulator]
body:
  - type: input
    id: app
    attributes:
      label: App name, and its package or a link
      placeholder: "PPSSPP, https://www.ppsspp.org/"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's not working?
      description: Not listed, won't start a game, wrong system... If you got it going in your own platforms.json, paste the entry here.
    validations:
      required: true
