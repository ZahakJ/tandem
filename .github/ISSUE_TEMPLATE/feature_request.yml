name: Feature idea
description: Something you'd like Tandem to do.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why, or how would you use it?
      description: Optional, but it helps us get it right.
